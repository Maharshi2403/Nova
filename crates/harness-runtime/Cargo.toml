[package]
name = "harness-runtime"
description = "AI Harness scheduler, worker management and budgets"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
globset = "0.4.21"
harness-core = { path = "../harness-core" }
harness-store = { path = "../harness-store" }
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "process", "rt", "time", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
