[workspace]
resolver = "3"
members = ["apps/cli", "apps/daemon", "crates/harness-core", "crates/harness-store", "crates/harness-runtime"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
