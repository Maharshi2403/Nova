[project]
name = "harness-ai"
version = "0.1.0"
description = "AI Harness intelligence layer: proposes actions and runs constrained LLM loops."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness-ai = "harness_ai.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
