[project]
name = "harness-ai"
version = "0.1.0"
description = "AI Harness intelligence layer: proposes actions and runs constrained LLM loops."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.26.0",
    "pydantic>=2",
]

[project.scripts]
harness-ai = "harness_ai.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.17.3",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = [
    "hatchling==1.33.0", "packaging==26.3", "pathspec==1.1.1", "pluggy==1.7.0",
    "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
