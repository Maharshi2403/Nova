name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Offline checks only: no provider credentials are configured in CI.
  HARNESS_PROVIDER: mock

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: intelligence/uv.lock

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Python sync
        working-directory: intelligence
        run: uv sync --locked

      - name: Rust tests
        run: cargo test --workspace

      - name: Python lint
        working-directory: intelligence
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Python types
        working-directory: intelligence
        run: uv run --locked mypy

      - name: Python tests
        working-directory: intelligence
        run: uv run --locked pytest
