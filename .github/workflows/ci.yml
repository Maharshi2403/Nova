name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Offline checks only: no provider credentials are configured in CI.
  HARNESS_PROVIDER: mock
  HARNESS_ENABLE_LIVE: "0"
  OPENAI_API_KEY: ""

jobs:
  checks:
    timeout-minutes: 30
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: intelligence/uv.lock

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust clippy
        run: cargo clippy --locked --offline --workspace --all-targets -- -D warnings

      - name: Python sync
        working-directory: intelligence
        run: uv sync --locked

      - name: Prepare hash-verified installation cache (dependency downloads only)
        run: uv run --locked --offline --project intelligence python scripts/prepare_release_cache.py

      - name: Rust tests
        run: cargo test --locked --offline --workspace

      - name: Build CLI and daemon
        run: cargo build --locked --offline --workspace

      - name: Real offline CLI workflow (100 tasks)
        run: uv run --locked --offline --project intelligence python scripts/offline_demo.py --tasks 100

      - name: Daemon kill and restart
        run: uv run --locked --offline --project intelligence python scripts/offline_demo.py --tasks 1 --fault

      - name: Cancel during verification
        run: uv run --locked --offline --project intelligence python scripts/offline_demo.py --tasks 1 --cancel

      - name: Python lint
        working-directory: intelligence
        run: |
          uv run --locked --offline ruff check .
          uv run --locked --offline ruff format --check .

      - name: Python types
        working-directory: intelligence
        run: uv run --locked --offline mypy

      - name: Python tests
        working-directory: intelligence
        run: uv run --locked --offline pytest

      - name: Documentation verifier tests
        run: uv run --locked --offline --project intelligence python -m unittest discover -s tests -p test_documentation_verifier.py

      - name: Release script quality
        run: |
          uv run --locked --offline --project intelligence ruff format --check --config intelligence/pyproject.toml scripts
          uv run --locked --offline --project intelligence ruff check --select E,F,I,B,W --config intelligence/pyproject.toml scripts

      - name: Native release build
        run: cargo build --release --locked --offline --workspace

      - name: Package native candidate
        run: uv run --locked --offline --project intelligence python scripts/package_release.py

      - name: Fresh extracted-bundle installation
        run: uv run --locked --offline --project intelligence python scripts/smoke_bundle.py --archive-dir dist

      - name: Upload local release candidates
        uses: actions/upload-artifact@v4
        with:
          name: nova-candidate-${{ runner.os }}-${{ runner.arch }}
          path: dist/nova-*
          if-no-files-found: error

      - name: Upload inspected local binaries
        uses: actions/upload-artifact@v4
        with:
          name: harness-debug-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/debug/nova
            target/debug/nova.exe
            target/debug/harness
            target/debug/harnessd
            target/debug/harness.exe
            target/debug/harnessd.exe
          if-no-files-found: error
